services:
  # Container for web app:
  web:
    build:
      context: .
    command: uvicorn main:app --host 0.0.0. --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000" # Expose
    volumes: 
      - app_data:/app/data
    depends_on: # Starts when database is ready
      db:
        condition: service_healthy
    health_check:
      test: ["CMD", "python", "-c", "import urrlib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Scrapers:
  scraper:
    build:
      context: .
    command: sh /app/scripts/run-scrapers.sh # Run infinite loop script
    env_file:
      - .env
    volumnes:
      - scraper_data:/app/status_scraper
    depends_on: # When web starts
      web:
        condition: service_healthy
    restart: unless stopped

  # PostgreSQL:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesonet
      POSTGRES_USER: mesonet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesonet -d mesonet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
  scraper_data:
    

  