{% extends "layout.html" %}

{% block content %}     
    <!-- ArcGIS Package 4.34 EOL planned 2028-->
    <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.34/"></script>

    <!-- GIS window-->
    <div id="mapLoading" class="loading_text" style="height: 70vh; padding-top: 200px;">Loading map...</div>
    <div id="viewDiv" style="height: 70vh; padding-top: 200px;"></div>

    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/GeoJSONLayer",
            "esri/renderers/SimpleRenderer",
            "esri/symbols/SimpleMarkerSymbol"
        ], async function(Map, MapView, GeoJSONLayer, SimpleRenderer, SimpleMarkerSymbol) {
                // Use SimpleRenderer to change look of the points
                const renderer = new SimpleRenderer({
                symbol: new SimpleMarkerSymbol({
                    style: "circle",
                    color: [0, 140, 255, 0.9],
                    size: 10,
                    outline: {
                        color: [255, 255, 255, 0.95],
                        width: 1.5
                    }
                })
            });

            // GeoJSON layer drops all other fields:
            const res = await fetch("/gis/geojson");
            const geojson = await res.json();

            const stationLookup = {};
            geojson.features.forEach(feature => {
                const props = feature.properties || {};
                if (props.station_name) {
                    stationLookup[props.station_name] = props.station_id;
                }
            });

            
            // Points
            const layer = new GeoJSONLayer({
            url: "/gis/geojson",
            title: "Weather Stations",
            outFields: ["station_id", "station_name", "is_public"],
            //outFields: ["*"],
            renderer: renderer,
            // Description of the station
            popupTemplate: {
                title: "{station_name}",
                content: function(feature) {
                    const graphic = feature.graphic || feature;
                    const attrs = graphic.attributes || {};
                    const stationName = attrs.station_name;
                    const stationId = stationLookup[stationName];

                    const div = document.createElement("div");
                    div.innerHTML = `
                        <b>Station ID:</b> ${stationId ?? "Missing"}<br>
                    `;

                    const link = document.createElement("a");
                    link.href = stationId
                        ? `/stations/public/${stationId}?units=imperial`
                        : "/stations";
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "Open dashboard";

                    div.appendChild(link);
                    return div;
                }
            }

            });

            const map = new Map({
            basemap: "streets",
            layers: [layer]
            });

            // Hide Map Loading page
            layer.when(function () {
                document.getElementById("mapLoading").style.display = "none";
            });

            

            // View
            const view = new MapView({
                container: "viewDiv",
                map: map,
                constraints: {
                    snapToZoom: false
                },
                padding: {
                    top: 40,
                    right: 40,
                    bottom: 40,
                    left: 40
                }
            });

            // Automatic Zoom
            view.when(() => {
                layer.when(() => {
                    layer.queryExtent({
                        outSpatialReference: view.spatialReference
                    }).then(async (response) => {
                        if (response.extent) {
                            await view.goTo(response.extent.clone().expand(2.2), { animate: false });
                            view.scale = view.scale * 1.2;
                        }
                    });
                });
            });
        });
    </script>
{% endblock %}
